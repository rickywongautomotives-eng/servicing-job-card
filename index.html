<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Servicing Job Card</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#14161a" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./styles.css" />
<script>
  // Escape hatch: opening the app with ?reset=1 tears out the service worker
  // and every cache, then reloads clean.
  //
  // Needed because the worker is cache-first for every file, so a device that
  // somehow fails to pick up a new worker will serve the old app forever with
  // no way out from inside the UI. A query string the old cache has never
  // seen is a guaranteed miss, so this file is always fetched fresh and this
  // script always runs -- which is what makes it work even when everything
  // else on the device is stale.
  //
  // Runs in <head>, before any app script, so nothing stale gets a chance to
  // render first.
  if (location.search.indexOf("reset=1") > -1 && "serviceWorker" in navigator) {
    document.documentElement.style.visibility = "hidden";
    (function () {
      navigator.serviceWorker
        .getRegistrations()
        .then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        })
        .then(function () { return caches.keys(); })
        .then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        })
        .then(function () {
          // Back to the plain URL so the reset doesn't run again on reload.
          location.replace(location.pathname);
        })
        .catch(function () { location.replace(location.pathname); });
    })();
  }
</script>
</head>
<body>
<div id="root">Loading job card&hellip;</div>

<!-- Vendor libraries (local copies, no network required after first setup) -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/htm.js"></script>
<script src="./vendor/html2canvas.min.js"></script>
<script src="./vendor/jspdf.umd.min.js"></script>
<script src="./vendor/firebase-app-compat.js"></script>
<script src="./vendor/firebase-firestore-compat.js"></script>
<script src="./vendor/firebase-storage-compat.js"></script>
<script src="./vendor/firebase-auth-compat.js"></script>
<script>
  // htm gives JSX-like syntax via tagged template literals, no compiler needed.
  var html = htm.bind(React.createElement);
</script>

<!-- App source -->
<script src="./src/config.js"></script>
<script src="./src/firebase-config.js"></script>
<script src="./src/storage.js"></script>
<script src="./src/sync.js"></script>
<script src="./src/App.js"></script>
<script src="./src/templates/pre-purchase-inspection.js"></script>
<script src="./src/templates/diagnostics.js"></script>
<script src="./src/app-shell.js"></script>
<script src="./src/main.js"></script>

<script>
  // PWA install + offline support. GitHub Pages (and any static host) serves
  // this over HTTPS, which is required for service workers to register.
  //
  // The reload below is the point of this block. sw.js calls skipWaiting()
  // and clients.claim(), so a new version takes control of the open page --
  // but the page is still running the JavaScript it already parsed, so the
  // update is invisible until the NEXT load. That is why a deploy appeared
  // to do nothing until you refreshed twice, which is impossible to guess
  // from the outside and cost real time chasing "stale" deploys that had in
  // fact shipped correctly.
  //
  // controllerchange also fires the very first time a worker installs (when
  // there was no controller at all); reloading then would be pointless, so
  // it is only acted on when this page was already controlled. The guard
  // flag stops any chance of a reload loop.
  if ("serviceWorker" in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading) return;
      reloading = true;
      window.location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        // Ask straight away rather than waiting for the browser's own
        // periodic check, so a deploy lands on the next open, not eventually.
        reg.update();
      });
    });
  }

  // Which version is this device ACTUALLY running? Without it, "I still see
  // the old one" and "the deploy didn't work" are indistinguishable from the
  // outside, and both have cost real time. Read from the live cache name
  // rather than a hardcoded string, so it cannot drift out of step with what
  // is really installed.
  window.addEventListener("load", function () {
    if (!("caches" in window)) return;
    caches.keys().then(function (keys) {
      var v = keys.filter(function (k) { return k.indexOf("job-card-") === 0; })[0];
      var tag = document.createElement("div");
      tag.className = "version-tag no-print";
      tag.textContent = v ? v.replace("job-card-", "") : "not cached";
      tag.title = "App version on this device. Tap to force a clean reload.";
      tag.onclick = function () { location.href = location.pathname + "?reset=1"; };
      document.body.appendChild(tag);
    });
  });
</script>
</body>
</html>
